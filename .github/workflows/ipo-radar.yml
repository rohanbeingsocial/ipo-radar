name: IPO radar daily update

# Scheduled runs moved to the Oracle VM (automation/vm/, systemd timer, 20:00 IST):
# GitHub's cron started this 4.5-6 h late every day, and a VM run can take as long as
# a full RHP backfill needs. This stays as a manual fallback (Actions -> Run workflow).
# Don't re-add a schedule while the VM timer is on: both would commit the same files.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipo-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r automation/requirements.txt

      - name: Run update pipeline
        run: python automation/update.py

      # Record the frozen rule's call on every new IPO BEFORE the outcome exists, and score
      # the ones that have since matured. A pattern found by searching history is only worth
      # anything if it survives on IPOs it has never seen — this is what makes that testable
      # instead of assertable. The ledger is append-only; a call is never rewritten.
      - name: Score the frozen hypothesis forward
        run: python automation/track_rule.py

      - name: Commit refreshed data
        run: |
          git config user.name "ipo-radar-bot"
          git config user.email "actions@github.com"
          git add data docs/data ipodata/finalipodata_expanded_20yr.xlsx
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git push
          fi
